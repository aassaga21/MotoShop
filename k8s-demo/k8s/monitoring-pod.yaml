apiVersion: v1
kind: Pod
metadata:
  name: monitoring-pod
  namespace: ecommerce
  labels:
    app: monitoring
spec:
  containers:

  # --- Container 1 : Prometheus (collecte des metriques) ---
  - name: prometheus
    image: prom/prometheus:v2.52.0
    ports:
    - containerPort: 9090
      name: prometheus
    args:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumeMounts:
    - name: prometheus-config
      mountPath: /etc/prometheus
    - name: prometheus-data
      mountPath: /prometheus
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
        cpu: "250m"

  # --- Container 2 : Grafana (dashboards de visualisation) ---
  - name: grafana
    image: grafana/grafana:10.4.0
    ports:
    - containerPort: 3000
      name: grafana
    env:
    - name: GF_SECURITY_ADMIN_USER
      value: "admin"
    - name: GF_SECURITY_ADMIN_PASSWORD
      value: "admin123"
    - name: GF_DATASOURCES_DEFAULT_TYPE
      value: "prometheus"
    - name: GF_DATASOURCES_DEFAULT_URL
      # Prometheus accessible via localhost car meme pod
      value: "http://localhost:9090"
    volumeMounts:
    - name: grafana-data
      mountPath: /var/lib/grafana
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"

  volumes:
  - name: prometheus-config
    configMap:
      name: prometheus-config
  - name: prometheus-data
    emptyDir: {}
  - name: grafana-data
    emptyDir: {}
