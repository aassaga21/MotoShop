apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
  namespace: ecommerce
  labels:
    app: monitoring
spec:
  selector:
    app: monitoring
  type: NodePort
  ports:
  - name: grafana
    port: 3000
    targetPort: 3000
    nodePort: 30300
  - name: prometheus
    port: 9090
    targetPort: 9090
    nodePort: 30900
